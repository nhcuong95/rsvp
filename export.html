<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSVP Report</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260916-1" />
  </head>
  <body>
    <main class="shell">
      <section class="panel admin-panel" aria-labelledby="page-title">
        <div class="heading">
          <p class="eyebrow">Roster report</p>
          <h1 id="page-title">Monthly Roster Report</h1>
        </div>

        <nav class="page-nav" aria-label="Page navigation">
          <input id="page-nav-toggle" class="page-nav-toggle" type="checkbox" />
          <label class="page-nav-button" for="page-nav-toggle" aria-label="Open page menu">☰</label>
          <div class="page-nav-links">
            <a href="./index.html">RSVP</a>
            <a class="admin-only" href="./roster.html">Members</a>
            <a class="active" href="./export.html" aria-current="page">Report</a>
            <a class="admin-only" href="./billing.html">Billing</a>
            <a href="./admin.html">Admin</a>
          </div>
        </nav>

        <form id="export-form" class="form">
          <label id="month-field" class="field">
            <span>Month</span>
            <select id="export-month" name="month" required>
              <option value="2026-08">August 2026</option>
              <option value="2026-09">September 2026</option>
            </select>
          </label>

          <button id="refresh-report-button" class="secondary-button" type="button">
            Refresh
          </button>
          <button id="export-button" type="submit" hidden>Recreate Latest Report</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <p id="stale-warning" class="stale-warning" hidden>
            Read-only report. Use Refresh to load the latest available data.
          </p>
          <div
            id="report-progress"
            class="report-progress"
            role="status"
            aria-live="polite"
            hidden
          >
            <div class="report-progress-track" aria-hidden="true">
              <div id="report-progress-bar" class="report-progress-bar"></div>
            </div>
            <p id="report-progress-text">Preparing report...</p>
          </div>
          <p id="share-status" class="status" hidden></p>
        </form>

        <section id="heatmap-section" class="admin-preview" hidden>
          <div class="preview-heading">
            <h2>Group Heatmap</h2>
            <p id="heatmap-note"></p>
          </div>
          <div id="group-heatmap" class="heatmap-grid"></div>
        </section>

        <section id="filter-section" class="admin-preview filter-panel" hidden>
          <label class="field">
            <span>Player</span>
            <select id="player-filter"></select>
          </label>
        </section>

        <section id="individual-section" class="admin-preview" hidden>
          <div class="preview-heading">
            <h2>Member Report</h2>
            <p id="individual-note"></p>
          </div>
          <div class="table-wrap compact-table-wrap">
            <table id="individual-table" class="export-table heatmap-table"></table>
          </div>
        </section>

        <section id="audit-section" class="admin-preview" hidden>
          <div class="preview-heading">
            <h2>Date Audit</h2>
            <p id="audit-note"></p>
          </div>
          <div class="table-wrap compact-table-wrap">
            <table id="audit-table" class="export-table audit-table"></table>
          </div>
        </section>

      </section>
    </main>

    <script src="./admin-auth.js?v=20260915-1"></script>
    <script src="./export.js?v=20260916-1"></script>
  </body>
</html>
