<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage Roster</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260912-1" />
  </head>
  <body>
    <main class="shell">
      <section class="panel admin-panel" aria-labelledby="page-title">
        <div class="heading">
          <p id="admin-eyebrow" class="eyebrow" hidden>Admin</p>
          <h1 id="page-title">Manage Roster</h1>
        </div>

        <nav class="page-nav" aria-label="Page navigation">
          <input id="page-nav-toggle" class="page-nav-toggle" type="checkbox" />
          <label class="page-nav-button" for="page-nav-toggle" aria-label="Open page menu">☰</label>
          <div class="page-nav-links">
            <a href="./index.html">RSVP</a>
            <a class="admin-only active" href="./roster.html" aria-current="page">Members</a>
            <a href="./export.html">Report</a>
            <a class="admin-only" href="./billing.html">Billing</a>
            <a href="./admin.html">Admin</a>
          </div>
        </nav>

        <p class="non-admin-only member-gate" role="status">
          Member management is admin-only. Log in on the
          <a href="./admin.html">Admin</a> tab to view or update member information.
        </p>

        <form id="roster-form" class="form admin-only">
          <div class="roster-form-grid">
            <label class="field">
              <span>Name</span>
              <input
                id="member-name"
                name="playerName"
                autocomplete="off"
                list="member-name-list"
                required
                placeholder="Search existing or type a new name"
                title="Search existing members or type a new name to add one"
              />
              <datalist id="member-name-list"></datalist>
            </label>

            <label class="field">
              <span>Venmo <small class="field-tag">Optional</small></span>
              <input
                id="venmo"
                name="venmo"
                autocomplete="off"
                placeholder="@username"
                title="Used for payment collection (Venmo or Zelle)"
              />
            </label>

            <label class="field">
              <span>Zelle <small class="field-tag">Optional</small></span>
              <input
                id="zelle"
                name="zelle"
                autocomplete="off"
                placeholder="Email or phone"
                title="Used for payment collection (Venmo or Zelle)"
              />
            </label>

            <label class="field">
              <span>Facebook Profile <small class="field-tag">Optional</small></span>
              <input
                id="messenger"
                name="messenger"
                autocomplete="off"
                placeholder="Facebook profile URL"
                title="Used to identify and contact the member"
              />
            </label>

            <label class="field roster-note-field">
              <span>Note <small class="field-tag">Optional</small></span>
              <textarea
                id="member-note"
                name="note"
                autocomplete="off"
                placeholder="Friend of/Cellphone/Dating Status/etc/"
                title="Friend of/Cellphone/Dating Status/etc/"
                rows="3"
              ></textarea>
            </label>

          </div>

          <div class="admin-roster-actions">
            <p id="status" class="status" role="status" aria-live="polite"></p>
            <button id="save-button" type="submit">Save Member</button>
          </div>
        </form>

        <section class="admin-preview admin-only">
          <div class="preview-heading">
            <h2>Members</h2>
            <p id="member-count">Loading...</p>
          </div>
          <label class="field roster-search-field">
            <span>Find member</span>
            <input
              id="member-search"
              autocomplete="off"
              placeholder="Search by name, Venmo, Zelle, Facebook, or note"
              type="search"
            />
            <small class="field-help">Click a member row to update that member.</small>
          </label>
          <div class="table-wrap roster-members-wrap">
            <table id="member-table" class="export-table roster-member-table"></table>
          </div>
        </section>

      </section>
    </main>

    <script src="./admin-auth.js?v=20260915-1"></script>
    <script src="./roster.js?v=20260911-3"></script>
  </body>
</html>
